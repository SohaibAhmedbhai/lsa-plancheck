name: Live-Demo (GitHub Pages)

# Erzeugt bei jedem Push die Beispielberichte neu und veröffentlicht sie
# zusammen mit der Startseite unter https://<nutzer>.github.io/lsa-plancheck/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Beispielprojekt prüfen und Berichte erzeugen
        run: |
          python -m lsa_pruefung pruefe beispiele/knoten_hauptstrasse_ringstrasse -o _site || true
          python -m lsa_pruefung matrix beispiele/knoten_hauptstrasse_ringstrasse -o _site
          cp site/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
